<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Owl Head / Icon -->
  <defs>
    <linearGradient id="owlHeadGrad" x1="50" y1="20" x2="50" y2="90" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="0.75" stop-color="#FBF9FE"/>
      <stop offset="1" stop-color="#F1ECFA"/>
    </linearGradient>
    <linearGradient id="hpGrad" x1="20" y1="20" x2="80" y2="20" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6D5FD0"/>
      <stop offset="1" stop-color="#8072E6"/>
    </linearGradient>
  </defs>
  <!-- Headphone Arc -->
  <path d="M26 44C26 24 36 14 50 14C64 14 74 24 74 44" stroke="url(#hpGrad)" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Headphone Cups (Mint) -->
  <rect x="18" y="40" width="10" height="20" rx="5" fill="#5EEAD4" stroke="#0D9488" stroke-width="1.2"/>
  <rect x="72" y="40" width="10" height="20" rx="5" fill="#5EEAD4" stroke="#0D9488" stroke-width="1.2"/>
  <!-- Head -->
  <rect x="22" y="24" width="56" height="60" rx="28" fill="url(#owlHeadGrad)" stroke="#E4DCF5" stroke-width="1.8"/>
  <!-- Belly / Cheeks -->
  <circle cx="34" cy="58" r="5" fill="#FFB3BA" opacity="0.8"/>
  <circle cx="66" cy="58" r="5" fill="#FFB3BA" opacity="0.8"/>
  <!-- Big Eyes -->
  <circle cx="39" cy="48" r="8" fill="#2D283E"/>
  <circle cx="37" cy="46" r="3" fill="#FFFFFF"/>
  <circle cx="42" cy="51" r="1.3" fill="#FFFFFF"/>
  <circle cx="61" cy="48" r="8" fill="#2D283E"/>
  <circle cx="59" cy="46" r="3" fill="#FFFFFF"/>
  <circle cx="64" cy="51" r="1.3" fill="#FFFFFF"/>
  <!-- Cute Beak -->
  <path d="M47 52C47 52 50 58 53 52H47Z" fill="#FCA35D"/>
</svg>
