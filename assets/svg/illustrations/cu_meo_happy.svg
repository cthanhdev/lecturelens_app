<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" fill="none">
  <!-- Happy Owl with wings up and sparkles -->
  <path d="M40 70 C40 34, 120 34, 120 70" stroke="#8072E6" stroke-linecap="round" stroke-width="7"/>
  <rect x="30" y="62" width="14" height="26" rx="6" fill="#5EEAD4" stroke="#0D9488" stroke-width="1.5"/>
  <rect x="116" y="62" width="14" height="26" rx="6" fill="#5EEAD4" stroke="#0D9488" stroke-width="1.5"/>
  <!-- Body -->
  <rect x="36" y="38" width="88" height="98" rx="44" fill="#FFFFFF" stroke="#E4DCF5" stroke-width="2"/>
  <ellipse cx="80" cy="94" rx="26" ry="28" fill="#F4EFFF" opacity="0.8"/>
  <!-- Cheeks -->
  <circle cx="56" cy="94" r="7" fill="#FFB3BA" opacity="0.85"/>
  <circle cx="104" cy="94" r="7" fill="#FFB3BA" opacity="0.85"/>
  <!-- Happy Eyes (curved arches ^_^) -->
  <path d="M56 78 Q64 70 72 78" stroke="#2D283E" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M88 78 Q96 70 104 78" stroke="#2D283E" stroke-width="3" stroke-linecap="round" fill="none"/>
  <!-- Beak -->
  <path d="M76 83C76 83 80 90 84 83H76Z" fill="#FCA35D"/>
  <!-- Happy Wing flapping -->
  <path d="M36 85 C24 75, 20 60, 26 50 C32 60, 36 70, 36 85Z" fill="#ECE4FA" stroke="#D9CEF2" stroke-width="1.5"/>
  <path d="M124 85 C136 75, 140 60, 134 50 C128 60, 124 70, 124 85Z" fill="#ECE4FA" stroke="#D9CEF2" stroke-width="1.5"/>
  <!-- Feet -->
  <ellipse cx="68" cy="136" rx="7" ry="4" fill="#F8B179"/>
  <ellipse cx="92" cy="136" rx="7" ry="4" fill="#F8B179"/>
  <!-- Sparkles -->
  <path d="M136 28 L138 34 L144 36 L138 38 L136 44 L134 38 L128 36 L134 34 Z" fill="#FFD700"/>
  <path d="M24 32 L25 36 L29 37 L25 38 L24 42 L23 38 L19 37 L23 36 Z" fill="#A78BFA"/>
</svg>
